- Steam:
    - Profile:
        widget:
            type: iframe
            id: profile
            name: Jamoncín
            src: {{HOMEPAGE_VAR_STEAM}}
            classes: h-max sm:h-60 md:h-60 lg:h-60 xl:h-60 2xl:h-72 # optional, use tailwind height classes, see https://tailwindcss.com/docs/height
            referrerPolicy: same-origin # optional, no default
            allowPolicy: autoplay; fullscreen; gamepad # optional, no default
            allowFullscreen: false # optional, default: true
            loadingStrategy: eager # optional, default: eager
            allowScrolling: no # optional, default: yes
            refreshInterval: 0 #ptional, no default
    - Achievements:
        widget:
            type: iframe
            name: Jamoncín's Achievements
            src: /images/achievement_showcase.jpg
            classes: h-max sm:h-60 md:h-60 lg:h-60 xl:h-60 2xl:h-72 # optional, use tailwind height classes, see https://tailwindcss.com/docs/height
            referrerPolicy: same-origin # optional, no default
            allowPolicy: autoplay; fullscreen; gamepad # optional, no default
            allowFullscreen: false # optional, default: true
            loadingStrategy: eager # optional, default: eager
            allowScrolling: no # optional, default: yes
            refreshInterval: 0 #ptional, no default
    - Dalek Empire Discord:
        widget:
            type: iframe
            name: Dalek Empire
            src: https://discord.com/widget?id={{HOMEPAGE_VAR_DISCORD_ID}}&theme=dark
            classes: h-auto sm:h-60 md:h-60 lg:h-60 xl:h-60 2xl:h-72 # optional, use tailwind height classes, see https://tailwindcss.com/docs/height
            referrerPolicy: same-origin # optional, no default
            allowPolicy: autoplay; fullscreen; gamepad # optional, no default
            allowFullscreen: false # optional, default: true
            loadingStrategy: eager # optional, default: eager
            allowScrolling: no # optional, default: yes
            refreshInterval: 0 # optional, no default
                   

- Calendar:
    - Calendar:
        widget:
            type: calendar
            firstDayInWeek: monday # optional - defaults to monday
            view: monthly # optional - possible values monthly, agenda
            maxEvents: 10 # optional - defaults to 10
            showTime: true # optional - show time for event happening today - defaults to false
            integrations:
              - type: ical
                url: {{HOMEPAGE_VAR_CALENDAR}}
                name: Cristian
                color: zinc
                params: # optional - additional params for the service
                showName: true
    - Agenda:
        widget:
            type: calendar
            view: agenda
            maxEvents: 10 # optional - defaults to 10
            showTime: true # optional - show time for event happening today - defaults to false
            previousDays: 3 # optional - shows events since three days ago - defaults to 0
            integrations:
              - type: ical
                url: {{HOMEPAGE_VAR_CALENDAR}}
                name: Cristian
                color: zinc
                params: # optional - additional params for the service
                showName: true
