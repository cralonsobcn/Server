- Metrics:
    - CPU Usage:
        widget:
            type: glances
            version: 4
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_GLANCES}}
            metric: cpu
    - Memory Usage:
        widget:
            type: glances
            version: 4
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_GLANCES}}
            metric: memory
    - Disk I/O:
        widget:
            type: glances
            version: 4
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_GLANCES}}
            metric: disk:sda
            chart: true
    - System Info:
        widget:
            type: glances
            version: 4
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_GLANCES}}
            metric: info

- Prometheus:
    - Target Overview:
        widget:
            type: prometheus
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_PROMETHEUS}}
    - CPU Usage Average:
        widget:
            type: prometheusmetric
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_PROMETHEUS}}
            refreshinterval: 15000
            metrics:
                - label: Average CPU/min
                  query: 'avg without (mode,cpu) (1 - rate(node_cpu_seconds_total{mode="idle", job="server"}[1m]))'
                  format:
                    type: number
                    scale: 100
                    suffix: "%"
    - Docker Disk and Memory:
        widget:
            type: prometheusmetric
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_PROMETHEUS}}
            refreshinterval: 15000
            metrics:
                - label: Disk I/O
                  query: sum(container_blkio_device_usage_total{name!~""}) # container_fs_io_current{name!~""}
                  format:
                    type: bytes
                - label: Memory Used
                  query: sum(container_memory_usage_bytes{name!~""}) 
                  format:
                    type: bytes
    - Docker Network Sent:
        widget:
            type: prometheusmetric
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_PROMETHEUS}}
            refreshinterval: 15000
            metrics:
                - label: Total Sent
                  query: sum(container_network_transmit_bytes_total{name!~""})
                  format:
                    type: bytes
                - label:  Total Errors
                  query: sum(container_network_transmit_errors_total{name!~""})
                  format:
                    type: bytes
                - label:  Total Dropped
                  query: sum(container_network_transmit_packets_dropped_total{name!~""})
                  format:
                    type: bytes
    - Docker Network Received:
        widget:
            type: prometheusmetric
            url: http://{{HOMEPAGE_VAR_SERVER_IP}}:{{HOMEPAGE_VAR_PROMETHEUS}}
            refreshinterval: 15000
            metrics:
                - label: Total Received
                  query: sum(container_network_receive_bytes_total{name!~""})
                  format:
                    type: bytes
                - label:  Total Errors
                  query: sum(container_network_receive_errors_total{name!~""})
                  format:
                    type: bytes
                - label:  Total Dropped
                  query: sum(container_network_receive_packets_dropped_total{name!~""})
                  format:
                    type: bytes

