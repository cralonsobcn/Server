# For configuration options and examples, please see:
# https://gethomepage.dev/latest/configs/service-widgets

- resources:
    uptime: true

- datetime:
    text_size: m
    format:
        timeStyle: short
        dateStyle: long
        hourCycle: h23

- greeting:
    text_size: m
    text: Cristian's Server

- openmeteo:
    text_size: m
    label: Barcelona # optional
    latitude: 41.410531
    longitude: 2.181370
    timezone: Europe/Madrid # optional
    units: metric # or imperial
    cache: 5 # Time in minutes to cache API responses, to stay within limits
    format: # optional, Intl.NumberFormat options
      maximumFractionDigits: 1

- search:
    provider: brave # google, duckduckgo, bing, baidu, brave or custom
    focus: true # Optional, will set focus to the search bar on page load
    showSearchSuggestions: true # Optional, will show search suggestions. Defaults to false
    target: _blank # One of _self, _blank, _parent or _tab

- logo: 
    icon: /images/Dalek.ico