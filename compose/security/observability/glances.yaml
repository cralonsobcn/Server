services:
  glances:
    image: docker.io/nicolargo/glances:4.3.3
    container_name: glances
    environment:
      - "GLANCES_OPT=-w"
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - cluster_network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: ${RESTART_POLICY}