services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment: 
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      LOG_LEVEL: error
      HOMEPAGE_VAR_SERVER_IP: ${SERVER_IP}
      HOMEPAGE_VAR_SECURITY_IP: ${SECURITY_IP}
      HOMEPAGE_VAR_NAS_IP: ${NAS_IP}
      HOMEPAGE_VAR_CALENDAR: ${CALENDAR_URL}
      HOMEPAGE_VAR_STEAM: ${STEAM_URL}
      HOMEPAGE_VAR_DISCORD_ID: ${DISCORD_WIDGET_ID}
      HOMEPAGE_VAR_SERVER_SUBDOMAIN_NAME: ${SERVER_SUBDOMAIN_NAME}
      HOMEPAGE_VAR_SECURITY_SUBDOMAIN_NAME: ${SECURITY_SUBDOMAIN_NAME}
      HOMEPAGE_VAR_NAS_SUBDOMAIN_NAME: ${NAS_SUBDOMAIN_NAME}
      HOMEPAGE_VAR_DOMAIN_NAME: ${DOMAIN_NAME}
      HOMEPAGE_ALLOWED_HOSTS: ${SECURITY_SUBDOMAIN_NAME}.${DOMAIN_NAME}                   # As of v1.0 there is one required environment variable to access homepage via a URL
    networks:
      - cluster_network
    volumes:
      - ${HOME}/Security/homepage/config:/app/config                                      # Path to the config folder
      - ${HOME}/Security/homepage/config/images:/app/public/images                        # Adding images
      - /var/run/docker.sock:/var/run/docker.sock:ro                                      # To enable docker monitoring
    restart: ${RESTART_POLICY}