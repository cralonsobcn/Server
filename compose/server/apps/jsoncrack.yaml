services:
  jsoncrack:
    image: ghcr.io/aykutsarac/jsoncrack:4.0.0
    build: 
      context: https://github.com/AykutSarac/jsoncrack.com.git
      dockerfile_inline: |
        FROM node:24.10.0-alpine AS base
        RUN npm install -g pnpm@10.10.0

        # Stage 1: Install dependencies
        FROM base AS deps
        WORKDIR /app
        COPY package.json pnpm-lock.yaml ./
        RUN corepack enable pnpm && pnpm install --no-frozen-lockfile

        # Stage 2: Build the application
        FROM base AS builder
        WORKDIR /app
        COPY --from=deps /app/node_modules ./node_modules
        COPY . .
        RUN corepack enable pnpm && pnpm run build

        # Stage 3: Production image
        FROM nginxinc/nginx-unprivileged:stable AS production
        WORKDIR /app
        COPY --from=builder /app/out /app
        COPY ./nginx.conf /etc/nginx/conf.d/default.conf

        EXPOSE 8080
    container_name: jsoncrack
    # environment:
    #   PUID: ${PUID}
    #   PGID: ${PGID}
    #   TZ: ${TZ}
      # NODE_ENV: "production[cristian@mechanicus jsoncrack.com]$"
    networks:
      - cluster-network
    restart: ${RESTART_POLICY}