services:
  jsoncrack:
    build: 
      context: https://github.com/AykutSarac/jsoncrack.com.git
    container_name: jsoncrack
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      NODE_ENV: "production[cristian@mechanicus jsoncrack.com]$"
    networks:
      - cluster_network
    restart: ${RESTART_POLICY}