services:
  stirling:    
    image: docker.io/stirlingtools/stirling-pdf:2.1.4   # available tags: latest, latest-fat, latest-ultra-lite
                                                        # Github Releases show specific version tags
    container_name: stirling
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DOCKER_ENABLE_SECURITY: false                     # This can significantly lower memory usage, especially during idle periods.
      LANGS: "en_GB"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: false
      #SECURITY_LOGINMETHOD: "none"
      #SECURITY_OAUTH2_ENABLED: false
    networks:
      - cluster-network
    volumes:
      - ${HOME}/Server/stirlingPDF/trainingData:/usr/share/tessdata #Required for extra OCR languages
      - ${HOME}/Server/stirlingPDF/extraConfigs:/configs
    restart: ${RESTART_POLICY}