services:
  bentopdf:
    image: ghcr.io/alam00000/bentopdf:1.15.1
    container_name: bentopdf
    environment:
      SIMPLE_MODE: true         # Build without LibreOffice tools
      BASE_URL: "/"             # Deploy to subdirectory
    networks:
      - cluster-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    restart: ${RESTART_POLICY}
