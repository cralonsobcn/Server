services:
  changedetection:
    image: lscr.io/linuxserver/changedetection.io:latest
    container_name: changedetection
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - cluster_network
    volumes:
      - ${HOME}/Server/changedetection/config:/config # Persistent config files
    restart: ${RESTART_POLICY}