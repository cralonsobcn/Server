---
services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
    networks:
    - cluster-network
    volumes:                          # TODO Add volume and persist the data
    - ${HOME}/Security/prometheus/config/prometheus.yml:/etc/prometheus/prometheus.yml        # path to /etc/prometheus.yml
    restart: ${RESTART_POLICY}
