services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - cluster-network
    volumes: # TODO
      - prowlarr-data:/config # Database and Prowlarr configs
    restart: ${RESTART_POLICY}

volumes:
  prowlarr-data:
    name: prowlarr-data
    driver: local