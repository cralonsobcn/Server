services:
  cryptpad:
    image: "cryptpad/cryptpad:version-2025.3.0"
    container_name: office_suite
    hostname: cryptpad
    environment:
      TZ: ${TZ}
      CPAD_MAIN_DOMAIN: "https://${NAS_SUBDOMAIN_NAME}.cryptpad.${DOMAIN_NAME}"
      CPAD_SANDBOX_DOMAIN: "https://${NAS_SUBDOMAIN_NAME}.cryptpad-sandbox.${DOMAIN_NAME}"
      CPAD_CONF: "/cryptpad/config/config.js"
      # Read and accept the license before uncommenting the following line:
      # https://github.com/ONLYOFFICE/web-apps/blob/master/LICENSE.txt
      CPAD_INSTALL_ONLYOFFICE: yes
    volumes:
      - ${HOME}/NAS/cryptpad/data/blob:/cryptpad/blob
      - ${HOME}/NAS/cryptpad/data/block:/cryptpad/block
      - ${HOME}/NAS/cryptpad/customize:/cryptpad/customize
      - ${HOME}/NAS/cryptpad/data/data:/cryptpad/data
      - ${HOME}/NAS/cryptpad/data/files:/cryptpad/datastore
      - ${HOME}/NAS/cryptpad/onlyoffice-dist:/cryptpad/www/common/onlyoffice/dist
      - ${HOME}/NAS/cryptpad/onlyoffice-conf:/cryptpad/onlyoffice-conf
    networks:
      - cluster_network
    ports:
      - "3000:3000"
      - "3003:3003"
    ulimits:
      nofile:
        soft: 1000000
        hard: 1000000
    restart: ${RESTART_POLICY}