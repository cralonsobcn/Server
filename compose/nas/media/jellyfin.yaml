services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.10.6
    container_name: jellyfin
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel #Enable iGPU to use QSV
    networks:
      - cluster_network
    ports:
      - 7359:7359/udp #optional. Allows clients to discover Jellyfin on the local network.
      - 1900:1900/udp #optional. Service discovery used by DNLA and clients.
    volumes: # TODO switch to named volume
      - ${HOME}/NAS/jellyfin/config:/config # Jellyfin data storage location. This can grow very large, 50gb+ is likely for a large collection
                                  # system.xml contains EnableMetrics. This allows Prometheus to scrap metrics
      - ${HOME}/NAS/jellyfin/tvseries:/data/tvshows # Media goes here. Add as many as needed e.g. /data/movies, /data/tv, etc.
      - ${HOME}/NAS/jellyfin/movies:/data/movies # Media goes here. Add as many as needed e.g. /data/movies, /data/tv, etc.
    devices:
      - /dev/dri:/dev/dri # Allows the application to access the render and iGPU devices
    restart: ${RESTART_POLICY}