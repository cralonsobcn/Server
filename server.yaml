    ports:
      - ${JACKETT_HOST_PORT}:${JACKETT_CONTAINER_PORT}
    volumes:
      - ${JACKETT_HOST_CONFIG}:${JACKETT_CONTAINER_CONFIG}
      - ${JACKETT_HOST_BLACKHOLE}:${JACKETT_CONTAINER_BLACKHOLE}
    restart: unless-stopped

  jellyseerr:
    image: docker.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    env_file:
      - env/.arr.env
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${JELLYSEERR_HOST_PORT}:${JELLYSEERR_CONTAINER_PORT}
    volumes:
      - ${JELLYSEERR_HOST_CONFIG}:${JELLYSEERR_CONTAINER_CONFIG}
    restart: unless-stopped


