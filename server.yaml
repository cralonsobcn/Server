networks:
  internal_network:
    driver: bridge
    name: internal_network

volumes:
  grafana-data:
    name: grafana-data # TODO change volume type
  kuma-data:
    name: kuma-data  # TODO I'll keep the configuration but not the logging
  arr-data:
    name: arr-data # TODO change volume type
  prowlarr-data:
    name: prowlarr-data
  prometheus-data:
    name: prometheus-data # TODO change volume type

## ( -- Monitoring and root apps -- )

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment: 
      TZ: ${TZ}
      HOMEPAGE_VAR_IP: ${IP}
      HOMEPAGE_VAR_CALENDAR: ${CALENDAR_URL}
      HOMEPAGE_VAR_STEAM: ${STEAM_URL}
      HOMEPAGE_VAR_DISCORD_ID: ${DISCORD_WIDGET_ID}
      # PORTS
      HOMEPAGE_VAR_CADVISOR: ${CADVISOR_HOST_PORT}
      HOMEPAGE_VAR_CHANGEDETECTION: ${CHANGEDETECTION_HOST_PORT}
      HOMEPAGE_VAR_CODE: ${CODE_HOST_PORT}
      HOMEPAGE_VAR_GITEA: ${GITEA_HOST_PORT}
      HOMEPAGE_VAR_GLANCES: ${GLANCES_HOST_PORT}
      HOMEPAGE_VAR_GRAFANA: ${GRAFANA_HOST_PORT}
      HOMEPAGE_VAR_HOMEPAGE: ${HOMEPAGE_HOST_PORT}
      HOMEPAGE_VAR_ITTOOLS: ${ITTOOLS_HOST_PORT}
      HOMEPAGE_VAR_JELLYFIN: ${JELLYFIN_HOST_PORT}
      HOMEPAGE_VAR_JELLYSEERR: ${JELLYSEERR_HOST_PORT}
      HOMEPAGE_VAR_PORTAINER: ${PORTAINER_HOST_PORT}
      HOMEPAGE_VAR_PROMETHEUS: ${PROMETHEUS_HOST_PORT}
      HOMEPAGE_VAR_PROWLARR: ${PROWLARR_HOST_PORT}
      HOMEPAGE_VAR_RADARR: ${RADARR_HOST_PORT}
      HOMEPAGE_VAR_READARR: ${READARR_HOST_PORT}
      HOMEPAGE_VAR_REDIS: ${REDIS_HOST_PORT}
      HOMEPAGE_VAR_SONARR: ${SONARR_HOST_PORT}
      HOMEPAGE_VAR_STIRLING: ${STIRLING_HOST_PORT}
      HOMEPAGE_VAR_UPTIMEKUMA: ${UPTIMEKUMA_HOST_PORT}
      HOMEPAGE_VAR_WEBCHECK: ${WEBCHECK_HOST_PORT}
    networks:
      - internal_network
    ports:
      - ${HOMEPAGE_HOST_PORT}:${HOMEPAGE_CONTAINER_PORT}
    volumes:
      - ${HOMEPAGE_HOST_CONFIG}:${HOMEPAGE_CONTAINER_CONFIG} 
      - ${DOCKER_SOCK}:${DOCKER_SOCK}  # path to docker.sock. Requires running the container as root
      - ${HOMEPAGE_HOST_IMAGES}:${HOMEPAGE_CONTAINER_IMAGES}
    restart: unless-stopped

  glances:
    image: docker.io/nicolargo/glances:latest-full
    container_name: glances
    environment:
      - "GLANCES_OPT=-w"
      - TZ=${TZ}
    networks:
      - internal_network
    ports:
      - ${GLANCES_HOST_PORT}:${GLANCES_CONTAINER_PORT}
    volumes:
      - ${DOCKER_SOCK}:${DOCKER_SOCK} # path to docker.sock
    restart: unless-stopped

  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:latest
    container_name: uptime-kuma
    environment:
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${UPTIMEKUMA_HOST_PORT}:${UPTIMEKUMA_CONTAINER_PORT}
    volumes:
      - kuma-data:${UPTIMEKUMA_CONTAINER_DATA}
      - ${DOCKER_SOCK}:${DOCKER_SOCK} # path to docker.sock
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    environment:
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${PROMETHEUS_HOST_PORT}:${PROMETHEUS_CONTAINER_PORT}
    volumes: # TODO Add volume and persist the data
      - ${PROMETHEUS_HOST_CONFIG}:${PROMETHEUS_CONTAINER_CONFIG} # path to /etc/prometheus.yml
    depends_on:
      - cadvisor
    restart: unless-stopped
  
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    environment:
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
    - ${CADVISOR_HOST_PORT}:${CADVISOR_CONTAINER_PORT}
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:rw
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    depends_on:
    - redis
    restart: unless-stopped

  redis:
    image: docker.io/redis:latest
    container_name: redis
    environment:
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
    - ${REDIS_HOST_PORT}:${REDIS_HOST_PORT}
    restart: unless-stopped

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    network_mode: host
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana-enterprise:latest
    container_name: grafana
    environment:
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${GRAFANA_HOST_PORT}:${GRAFANA_CONTAINER_PORT}
    volumes:
      - grafana-data:${GRAFANA_CONTAINER_DATA}
    restart: unless-stopped

## ( -- Non-root Apps -- )
  it-tools: 
    image: docker.io/corentinth/it-tools:latest
    container_name: "it_tools"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${ITTOOLS_HOST_PORT}:${ITTOOLS_CONTAINER_PORT}
    restart: unless-stopped

  web-check: 
    image: docker.io/lissy93/web-check:latest
    container_name: Web-Check
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${WEBCHECK_HOST_PORT}:${WEBCHECK_CONTAINER_PORT}
    restart: unless-stopped

  codeServer:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      SUDO_PASSWORD: "test"
    networks:
      - internal_network
    ports:
      - ${CODE_HOST_PORT}:${CODE_CONTAINER_PORT}
    volumes: # TODO map volume
      - ${CODE_HOST_CONFIG}:${CODE_CONTAINER_CONFIG}
    restart: unless-stopped

  stirling:
    image: docker.io/stirlingtools/stirling-pdf:latest
    container_name: stirling
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DOCKER_ENABLE_SECURITY: false
      LANGS: "en_US"
      INSTALL_BOOK_AND_ADVANCED_HTML_OPS: false
      #SECURITY_LOGINMETHOD: "none"
      #SECURITY_OAUTH2_ENABLED: false
    networks:
      - internal_network
    ports:
      - ${STIRLING_HOST_PORT}:${STIRLING_CONTAINER_PORT}
    volumes:
      - ./stirlingPDF/trainingData:/usr/share/tessdata #Required for extra OCR languages
      - ./stirlingPDF/extraConfigs:/configs
    restart: unless-stopped

  changedetection:
    image: lscr.io/linuxserver/changedetection.io:latest
    container_name: changedetection
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${CHANGEDETECTION_HOST_PORT}:${CHANGEDETECTION_CONTAINER_PORT}
    volumes:
      - ./changedetection/config:/config # Persistent config files
    restart: unless-stopped

  ## ( -- Lingua Cafe -- ) ## TODO move to NAS

  webserver:
    image: ghcr.io/simjanos-dev/linguacafe-webserver:${VERSION:-latest}
    container_name: linguacafe-webserver
    restart: unless-stopped
    depends_on:
        mysql:
            condition: service_healthy
    volumes:
        - ./storage:/var/www/html/storage
    environment:
        DB_DATABASE: ${DB_DATABASE}
        DB_USERNAME: ${DB_USERNAME}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
    ports:
        - "9191:80"
    networks:
        - internal_network
    extra_hosts:
        - "host.docker.internal:host-gateway"
  mysql:
    image: mysql:8.0
    container_name: linguacafe-database
    restart: unless-stopped
    tty: true
    healthcheck:
        test: ["CMD", 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p$MYSQL_ROOT_PASSWORD']
        interval: 10s
        timeout: 5s
        retries: 10
    volumes:
        - ./database:/var/lib/mysql
    environment:
        MYSQL_DATABASE: ${DB_DATABASE}
        MYSQL_USER: ${DB_USERNAME}
        MYSQL_PASSWORD: ${DB_PASSWORD}
        MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        SERVICE_NAME: linguacafe
    command: mysqld --general-log=1 --general-log-file=/var/lib/mysql/general-log.log
    networks:
        - internal_network
          
  python:
    container_name: linguacafe-python-service
    command: "python3 /app/tokenizer.py"
    restart: unless-stopped
    tty: true
    image: ghcr.io/simjanos-dev/linguacafe-python-service:${VERSION:-latest}
    environment:
        PYTHONPATH: "/var/www/html/storage/app/model"
    volumes:
        - ./storage:/var/www/html/storage
    networks:
        - internal_network
    platform: ${PLATFORM:-}

## ( -- ARR Stack -- )

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${RADARR_HOST_PORT}:${RADARR_CONTAINER_PORT}
    volumes:
      - arr-data:/config
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${SONARR_HOST_PORT}:${SONARR_CONTAINER_PORT}
    volumes:
      - ${SONARR_HOST_CONFIG}:${SONARR_CONTAINER_CONFIG}
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${PROWLARR_HOST_PORT}:${PROWLARR_CONTAINER_PORT}
    volumes: # TODO
      - prowlarr-data:/config # Database and Prowlarr configs
    restart: unless-stopped

  readarr:
    image: lscr.io/linuxserver/readarr:develop
    container_name: readarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./readarr/config:/config # Database and Readarr configs
      - ./readarr/books:/books # Location of Book library on disk (See note in Application setup) optional
      - ./readarr/downloads:/downloads # Location of download managers output directory (See note in Application setup) optional
    ports:
      - ${READARR_HOST_PORT}:${READARR_CONTAINER_PORT}
    restart: unless-stopped

  jellyseerr:
    image: docker.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      LOG_LEVEL: debug
    networks:
      - internal_network
    ports:
      - ${JELLYSEERR_HOST_PORT}:${JELLYSEERR_CONTAINER_PORT}
    volumes:
      - ${JELLYSEERR_HOST_CONFIG}:${JELLYSEERR_CONTAINER_CONFIG}
    restart: unless-stopped


