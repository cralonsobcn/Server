# ( --- Static Configuration --- )
global:
  checkNewVersion: true
  sendAnonymousUsage: false

providers:
  file:
    directory: /etc/traefik  # this is the path within the traefik container where the static config is stored. This must be mounted in the volumes section of the docker compose file.
    debugLogGeneratedTemplate: true
    watch: true # Set the watch option to true to allow Traefik to automatically watch for file changes

api:
  dashboard: true # Enables Traefik dashboard
  insecure: true # Enable the API in insecure mode, which means that the API will be available directly on the entryPoint named traefik, on path /api
  disabledashboardad: true
  debug: true # Enable additional endpoints for debugging and profiling, served under /debug/

log:
  level: DEBUG # Switch to ERROR in production env
  filePath: /etc/traefik/logs/traefik.log  # Mount this path in the volumes section of the docker compose
  format: common  # format [common, json, logfmt]
  maxBackups: 3 # maximum number of old log files to retain.
  maxAge: 7 # maximum number of days to retain old log files based on the timestamp encoded in their filename
  
accesslog:
  format: common  # format [common, json, logfmt]
  addInternals: true # Enables access logs for internal resources 
  filePath: /etc/traefik/logs/access.log  # Mount this path in the volumes section of the docker compose

tracing:
  addInternals: true
  serviceName: traefik

metrics:
  addInternals: true
  prometheus:
    addEntryPointsLabels: true # Enable metrics on entry points.
    addRoutersLabels: true # Enable metrics on routers.
    addServicesLabels: true

entryPoints:
  web:
    address: ":80"
    http: # Redirect to https
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  metrics: # Entrypoint for Prometheus scrapper
    address: ":8082"

serversTransport:
  insecureSkipVerify: true

certificatesResolvers:
  security-resolver: # Names the resolvers 
    acme:
      tlschallenge: true
      email: '{{env "EMAIL"}}'
      certificatesDuration: 30
      storage: ./traefik/config/certs/security.json # File path used for certificates storage.
      #dnsChallenge:
      #  provider: cloudflare  # <-- (Optional) Change this to your DNS provider
      #  resolvers:
      #    - "1.1.1.1:53"
      #    - "8.8.8.8:53"
  server-resolver: 
    acme:
      tlschallenge: true
      email: '{{env "EMAIL"}}'
      certificatesDuration: 30
      storage: ./traefik/config/certs/server.json
  nas-resolver: 
    acme:
      tlschallenge: true
      email: '{{env "EMAIL"}}'
      certificatesDuration: 30
      storage: ./traefik/config/certs/nas.json

# ( --- Dynamic Configuration --- )

http:
  routers:
  # ( --- Security Routers--- )
    portainer:
      entryPoints: # Allows request only from the predefined entry point named "web" and "websecure" (http and https respectively).
        - web
        - websecure
      rule: Host(`portainer.localhost`)       # The domain portainer.localhost will resolve but portainer.mechanicus doesn't
                                              # Mechanicus is addded in my personal router as DNS record (A)
                                              # pinging this address uses ipv6????
            #PathPrefix(`/portainer`)
      service: portainer # References the service
      tls:
        certResolver: security-resolver
      observability:
        accessLogs: true
        tracing: true
        metrics: true

    traefik:
