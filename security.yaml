networks:
  security_network:
    driver: bridge
    name: security_network
#  pihole_macvlan:
#    driver: macvlan
#    name: pihole_macvlan
#    driver_opts:
#      parent: enp0s3
#    ipam:
#      config:
#        - subnet: 192.168.1.0/24
#          gateway: 192.168.1.1
#          ip_range: 192.168.1.2/32

volumes:
  portainer-data:
    name: portainer-data # TODO change volume type
  pihole-data:
    name: pihole-data # TODO change volume type
  authelia-data:
    name: authelia-data

services:
  security-dockerproxy: # Service to securly expose the docker socket to the HOMEPAGE app in Server
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: security-dockerproxy
    environment:
      - CONTAINERS=1 # Allow access to viewing containers
      - SERVICES=1 # Allow access to viewing services (necessary when using Docker Swarm)
      - TASKS=1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      - POST=0 # Disallow any POST operations (effectively read-only)
      - INFO=1 # Necessary to query logs from Dazzle/Server
      - CONTAINERS=1 # Necessary to query logs from Dazzle/Server
      - LOG_LEVEL=debug
    networks:
      - security_network
    ports:
      - ${SECURITY_IP}:2375:2375
    volumes:
      - ${DOCKER_SOCK}:${DOCKER_SOCK}:ro # Mounted as read-only
    restart: unless-stopped

  traefik:
    image: traefik:latest 
    container_name: traefik
    environment:
      TZ: ${TZ}
      SECURITY_IP: ${SECURITY_IP}
      SERVER_IP: ${SERVER_IP}
      NAS_IP: ${NAS_IP}
      DOCKER_SOCK: ${DOCKER_SOCK}
      # Traefik specific
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARERESOLVER_ACME_EMAIL: ${EMAIL}
      SERVER_SUBDOMAIN_NAME: ${SERVER_SUBDOMAIN_NAME}
      SECURITY_SUBDOMAIN_NAME: ${SECURITY_SUBDOMAIN_NAME}
      NAS_SUBDOMAIN_NAME: ${NAS_SUBDOMAIN_NAME}
      DOMAIN_NAME: ${DOMAIN_NAME}
      # Cloudflare Specific
      CLOUDFLARE_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
      # Security ports
      PORTAINER_HTTP_HOST_PORT: ${PORTAINER_HTTP_HOST_PORT} 
      PORTAINER_HTTPS_HOST_PORT: ${PORTAINER_HTTPS_HOST_PORT} 
      PIHOLE_HOST_PORT: ${PIHOLE_HOST_HTTP_PORT}
      TRAEFIK_DASHBOARD_HOST_PORT: ${TRAEFIK_DASHBOARD_HOST_PORT}
      AUTHELIA_HOST_PORT: ${AUTHELIA_HOST_PORT}
      WHATSUPDOCKER_HOST_PORT: ${WHATSUPDOCKER_HOST_PORT}
      # Server ports
      CADVISOR_HOST_PORT: ${CADVISOR_HOST_PORT}
      CHANGEDETECTION_HOST_PORT: ${CHANGEDETECTION_HOST_PORT}
      CODE_HOST_PORT: ${CODE_HOST_PORT}
      DOZZLE_HOST_PORT: ${DOZZLE_HOST_PORT}
      GLANCES_HOST_PORT: ${GLANCES_HOST_PORT}
      GRAFANA_HOST_PORT: ${GRAFANA_HOST_PORT}
      HOMEPAGE_HOST_PORT: ${HOMEPAGE_HOST_PORT}
      ITTOOLS_HOST_PORT: ${ITTOOLS_HOST_PORT}
      JELLYSEERR_HOST_PORT: ${JELLYSEERR_HOST_PORT}
      JSONCRACK_HOST_PORT: ${JSONCRACK_HOST_PORT}
      PROMETHEUS_HOST_PORT: ${PROMETHEUS_HOST_PORT}
      PROWLARR_HOST_PORT: ${PROWLARR_HOST_PORT}
      RADARR_HOST_PORT: ${RADARR_HOST_PORT}
      READARR_HOST_PORT: ${READARR_HOST_PORT}
      SONARR_HOST_PORT: ${SONARR_HOST_PORT}
      STIRLING_HOST_PORT: ${STIRLING_HOST_PORT}
      UPTIMEKUMA_HOST_HTTPS: ${UPTIMEKUMA_HOST_HTTPS}
      UPTIMEKUMA_HOST_PORT: ${UPTIMEKUMA_HOST_PORT}
      WEBCHECK_HOST_PORT: ${WEBCHECK_HOST_PORT}
      # NAS Ports
      GITEA_HOST_PORT: ${GITEA_HOST_PORT}
      JELLYFIN_HOST_PORT: ${JELLYFIN_HOST_PORT}
      QBITORRENT_UI_HOST_PORT: ${QBITORRENT_UI_HOST_PORT}
      NETBOOT_HOST_TCP_PORT: ${NETBOOT_HOST_TCP_PORT}
    networks: 
      - security_network
    extra_hosts: # Explictly defines the hostnames. Equivalent to write on /etc/hosts within the container
      - ${SECURITY_SUBDOMAIN_NAME}:${SECURITY_IP}
      - ${SERVER_SUBDOMAIN_NAME}:${SERVER_IP}
      - ${NAS_SUBDOMAIN_NAME}:${NAS_IP}
    ports: 
      - ${TRAEFIK_HTTP_PORT}:${TRAEFIK_HTTP_PORT}
      - ${TRAEFIK_HTTPS_PORT}:${TRAEFIK_HTTPS_PORT}
      - ${TRAEFIK_DASHBOARD_HOST_PORT}:${TRAEFIK_DASHBOARD_CONTAINER_PORT} # (Optional) Enable Dashboard, don't do in production as the API does not require authentication
    volumes:
      - ${DOCKER_SOCK}:${DOCKER_SOCK}
      - "./traefik/traefik.yaml:/etc/traefik/traefik.yaml" # Static and Dynamic configuration path
      - "./traefik/certs/acme.json:/etc/traefik/acme.json" # Certs folder where letsencrypt will store the certificates
      - "./traefik/logs:/etc/traefik/logs" # Logs folder
    restart: unless-stopped

  cloudflared: # Clodufare tunnel
    image: cloudflare/cloudflared:latest
    container_name: custodes-tunnel
    command: tunnel --no-autoupdate --loglevel error run
    environment:
      TZ: ${TZ}
      TUNNEL_TOKEN: ${SECURITY_CLOUDFARE_TUNNEL_TOKEN}
    networks:
      - security_network
    extra_hosts: # Explictly defines the hostnames. Equivalent to write on /etc/hosts within the container
      - ${SECURITY_SUBDOMAIN_NAME}:${SECURITY_IP}
      - ${SERVER_SUBDOMAIN_NAME}:${SERVER_IP}
      - ${NAS_SUBDOMAIN_NAME}:${NAS_IP}
    restart: unless-stopped

  portainer:
    image: docker.io/portainer/portainer-ce:latest
    container_name: portainer
    command:
      - --http-enabled
    environment:
      TZ: ${TZ}
    networks:
      - security_network
    ports:
      #- ${PORTAINER_HTTPS_HOST_PORT}:${PORTAINER_HTTPS_CONTAINER_PORT} #HTTPS Login
      - ${SECURITY_IP}:${PORTAINER_HTTP_HOST_PORT}:${PORTAINER_HTTP_CONTAINER_PORT} #HTTP Login
    volumes:
      - portainer-data:/data
      - ${DOCKER_SOCK}:${DOCKER_SOCK} # path to docker.sock      
    restart: unless-stopped

  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    environment:
      TZ: ${TZ}
      FTLCONF_debug_api: true
      # FTLCONF_dns_dnssec: ${DNSSEC}
      FTLCONF_dns_listeningMode: all # Major update on Pihole v6.0.1. If using Docker's default bridge network setting, set the environment variable FTLCONF_dns_listeningMode to all.
      FTLCONF_webserver_api_password: ${WEBPASSWORD} # Major update on Pihole v6.0.1
      FTLCONF_webserver_interface_theme: "default-darker" # Major update on Pihole v6.0.1
      PH_VERBOSE: 1 # Switch to 0 in prod
      TAIL_FTL_LOG: 1
    cap_add: 
      - CAP_SYS_NICE # FTL sets itself as an important process to get some more processing time if the latter is running low
      - CAP_NET_BIND_SERVICE # Allows FTLDNS binding to TCP/UDP sockets below 1024 (specifically DNS service on port 53)
      - CAP_CHOWN # we need to be able to change ownership of log files and databases in case FTL is started as a different user than pihole
      - CAP_NET_ADMIN # Modify routing tables and other network-related operations (in particular inserting an entry in the neighbor table to answer DHCP requests using unicast packets)
      - CAP_SYS_TIME # FTL needs to be able to set the system time to update it using the Network Time Protocol (NTP) in the background
    networks:
      - security_network
      #- pihole_macvlan # macvlan to expose pihole as DNS upstream server
    ports: # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
      - ${SECURITY_IP}:53:53/tcp
      - ${SECURITY_IP}:53:53/udp
      - ${SECURITY_IP}:${PIHOLE_HOST_HTTP_PORT}:${PIHOLE_CONTAINER_HTTP_PORT}/tcp 
      #- ${SECURITY_IP}:${PIHOLE_HOST_HTTPS_PORT}:${PIHOLE_CONTAINER_HTTPS_PORT}/tcp
    volumes: #TODO move to env and named volumes
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d
      # - ./pihole/logs/pihole.log:/var/log/pihole/pihole.log # Path to the logs?
    restart: unless-stopped

  whatsupdocker:
    image: docker.io/getwud/wud
    container_name: whatsupdocker
    environment:
      TZ: ${TZ}
    networks:
      - security_network
    ports:
      - ${SECURITY_IP}:${WHATSUPDOCKER_HOST_PORT}:${WHATSUPDOCKER_CONTAINER_PORT}
    volumes:
      - ${DOCKER_SOCK}:${DOCKER_SOCK}
    restart: unless-stopped

  authelia: # TODO. TS application crashing. Details @ authelia.log
    image: docker.io/authelia/authelia:latest
    container_name: authelia
    environment: # TODO Migrate secrets
      TZ: ${TZ}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_PASSWORD: ${STORAGE_PASSWORD}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      AUTHELIA_LOG_LEVEL: 'error'
    networks:
      - security_network
    ports:
      - ${AUTHELIA_HOST_PORT}:${AUTHELIA_CONTAINER_PORT}
    volumes: # TODO Migrate secrets
      - ./authelia/config:/config
      - ./authelia/secrets:/secrets # TODO define secrets
    restart: unless-stopped
