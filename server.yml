networks:
  server-network:
    driver: bridge

services:
##Homepage
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - server-network
    ports:
      - ${HOMEPAGE_HOST_PORT}:${HOMEPAGE_CONTAINER_PORT}
    volumes:
      - ${HOMEPAGE_HOST_CONFIG}:${HOMEPAGE_CONTAINER_CONFIG} # Make sure your local config directory exists
      - ${HOMEPAGE_HOST_DOCKER}:${HOMEPAGE_CONTAINER_DOCKER} # (optional) For docker integrations
      - ${HOMEPAGE_HOST_IMAGES}:${HOMEPAGE_CONTAINER_IMAGES} # To store local images and use them later as background
    restart: unless-stopped

##Monitoring
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:latest
    container_name: uptime-kuma
    networks:
      - server-network
    ports:
      - ${UPTIMEKUMA_HOST_PORT}:${UPTIMEKUMA_CONTAINER_PORT}
    volumes:
      - ${UPTIMEKUMA_HOST_DATA}:${UPTIMEKUMA_CONTAINER_DATA}
      - ${UPTIMEKUMA_HOST_DOCKER}:${UPTIMEKUMA_CONTAINER_DOCKER}
    restart: unless-stopped

  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: prometheus
    networks:
      - server-network
    ports:
      - ${PROMETHEUS_HOST_PORT}:${PROMETHEUS_CONTAINER_PORT}
    volumes:
      - ${PROMETHEUS_HOST_CONFIG}:${PROMETHEUS_CONTAINER_CONFIG}
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana-enterprise:latest
    container_name: grafana
    networks:
      - server-network
    ports:
      - ${GRAFANA_HOST_PORT}:${GRAFANA_CONTAINER_PORT}
    volumes:
      - ${GRAFANA_HOST_DATA}:${GRAFANA_CONTAINER_DATA}
    restart: unless-stopped

  glances:
    image: docker.io/nicolargo/glances:latest-full
    container_name: glances
    networks:
      - server-network
    volumes:
      - ${GLANCES_HOST_DOCKER}:${GLANCES_CONTAINER_DOCKER}
    environment:
      - "GLANCES_OPT=-w"
    restart: unless-stopped

##ARR stack
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    env_file:
      - env/.arr.env
    networks:
      - server-network
    ports:
      - ${RADARR_HOST_PORT}:${RADARR_CONTAINER_PORT}
    volumes:
      - ./radarr/config:/config
      # - /path/to/movies:/movies #optional
      # - /path/to/download-client-downloads:/downloads #optional
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    env_file:
      - env/.arr.env
    networks:
      - server-network
    ports:
      - ${SONARR_HOST_PORT}:${SONARR_CONTAINER_PORT}
    volumes:
      - ${RADARR_HOST_CONFIG}:${RADARR_CONTAINER_CONFIG}
     # - /path/to/tvseries:/tv #optional
     # - /path/to/downloadclient-downloads:/downloads #optional
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    env_file:
      - env/.arr.env
    networks:
      - server-network
    ports:
      - ${JACKETT_HOST_PORT}:${JACKETT_CONTAINER_PORT}
    volumes:
      - ${JACKETT_HOST_CONFIG}:${JACKETT_CONTAINER_CONFIG}
      - ${JACKETT_HOST_BLACKHOLE}:${JACKETT_CONTAINER_BLACKHOLE}
    restart: unless-stopped

  jellyseerr:
    image: docker.io/fallenbagel/jellyseerr:latest
    container_name: jellyseerr
    env_file:
      - env/.arr.env
    networks:
      - server-network
    ports:
      - ${JELLYSEERR_HOST_PORT}:${JELLYSEERR_CONTAINER_PORT}
    volumes:
      - ${JELLYSEERR_HOST_CONFIG}:${JELLYSEERR_CONTAINER_CONFIG}
    restart: unless-stopped

##Jellyfin
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    env_file:
      - env/.jellyfin.env
    networks:
      - server-network
    ports:
      - ${JELLYFIN_HOST_PORT}:${JELLYFIN_CONTAINER_PORT}
      - ${JELLYFIN_HOST_PORT_HTTPS}:${JELLYFIN_CONTAINER_PORT_HTTPS}
      - 7359:7359/udp #optional
      - 1900:1900/udp #optional
    volumes:
      - ${JELLYFIN_HOST_CONFIG}:${JELLYFIN_CONTAINER_CONFIG}
      #- ./qbitorrent/downloads:/data/tvshows #this will be eventually mapped to a different folder
      #- ./qbitorrent/downloads:/data/movies  #same here
    devices:
      - /dev/dri:/dev/dri #let the application access the render and iGPU devices
    restart: unless-stopped

##IT Tools
  it-tools: #https://github.com/CorentinTh/it-tools
    image: corentinth/it-tools:latest
    container_name: "IT_Tools"
    networks:
      - server-network
    ports:
      - ${ITTOOLS_HOST_PORT}:${ITTOOLS_CONTAINER_PORT}
    restart: unless-stopped

##Web Check
  web-check: 
    # https://github.com/Lissy93/web-check?ref=selfh.st
    # https://hub.docker.com/r/lissy93/web-check
    image: docker.io/lissy93/web-check:latest
    container_name: Web-Check
    networks:
      - server-network
    ports:
      - ${WEBCHECK_HOST_PORT}:${WEBCHECK_CONTAINER_PORT}
    restart: unless-stopped

##Code Server
  codeServer: #https://hub.docker.com/r/linuxserver/code-server
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    #environment:
      #- PASSWORD=password #optional
      #- HASHED_PASSWORD= #optional
      #- SUDO_PASSWORD=password #optional
      #- SUDO_PASSWORD_HASH= #optional
      #- PROXY_DOMAIN=code-server.my.domain #optional
      #- DEFAULT_WORKSPACE=/config/workspace #optional
    networks:
      - server-network
    ports:
      - ${CODE_HOST_PORT}:${CODE_CONTAINER_PORT}
    volumes:
      - ${CODE_HOST_CONFIG}:${CODE_CONTAINER_CONFIG}
    restart: unless-stopped

  # TODO grafana Error: must provide a non-empty container port to publish
  # TODO Error: statfs /var/run/podman/podman.sock: permission denied