networks:
  nas_network:
    driver: bridge
    name: nas_network

volumes:
  gitea-data: # TODO change volume type
    name: gitea-data
  jellyfin-media: # TODO change volume type
    name: jellyfin-media
  qbitorrent-data: # TODO change volume type
    name: qbitorrent-data
  netbootxyz-data: # TODO change volume type
    name: netbootxyz-data

services:
  nas-dockerproxy: # Service to securly expose the docker socket to the HOMEPAGE app in Server
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: nas-dockerproxy
    environment:
      - CONTAINERS=1 # Allow access to viewing containers
      - SERVICES=1 # Allow access to viewing services (necessary when using Docker Swarm)
      - TASKS=1 # Allow access to viewing tasks (necessary when using Docker Swarm)
      - POST=0 # Disallow any POST operations (effectively read-only)
      - INFO=1 # Necessary to query logs from Dazzle/Server
      - CONTAINERS=1 # Necessary to query logs from Dazzle/Server
      - LOG_LEVEL=debug
    networks:
      - nas_network
    ports:
      - ${NAS_IP}:2375:2375
    volumes:
      - ${DOCKER_SOCK}:${DOCKER_SOCK}:ro # Mounted as read-only
    restart: unless-stopped
    
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DOCKER_MODS: linuxserver/mods:jellyfin-opencl-intel #Enable iGPU to use QSV
    networks:
      - nas_network
    ports:
      - ${JELLYFIN_HOST_PORT}:${JELLYFIN_CONTAINER_PORT}
      - ${JELLYFIN_HOST_PORT_HTTPS}:${JELLYFIN_CONTAINER_PORT_HTTPS}
      - 8920:8920 #optional. Https webUI
      - 7359:7359/udp #optional. Allows clients to discover Jellyfin on the local network.
      - 1900:1900/udp #optional. Service discovery used by DNLA and clients.
    volumes: # TODO switch to named volume
      - ./jellyfin/config:/config # Jellyfin data storage location. This can grow very large, 50gb+ is likely for a large collection
                                  # system.xml contains EnableMetrics. This allows Prometheus to scrap metrics
      - ./jellyfin/tvseries:/data/tvshows # Media goes here. Add as many as needed e.g. /data/movies, /data/tv, etc.
      - ./jellyfin/movies:/data/movies # Media goes here. Add as many as needed e.g. /data/movies, /data/tv, etc.
    devices:
      - /dev/dri:/dev/dri # Allows the application to access the render and iGPU devices
    restart: unless-stopped

  gitea:
    image: docker.io/gitea/gitea:latest
    container_name: gitea
    environment:
      # USER: git
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    networks:
      - nas_network
    ports:
      - ${GITEA_HOST_PORT}:${GITEA_CONTAINER_PORT}
      - ${GITEA_HOST_SSH_PORT}:${GITEA_CONTAINER_SSH_PORT}
    volumes: # TODO move to named volume
      # - gitea-data:/data # app.ini in /var/lib/docker/volumes/server_gitea-data
      # /data/gitea/gitea.db container path to the sqlite3 database
      - ./gitea/data:/var/lib/gitea
      - ./gitea/config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBTORRENT_UI_HOST_PORT}
      TORRENTING_PORT: ${QBTORRENT_TORRENTING_HOST_PORT}
    networks:
      - nas_network
    ports:
      - ${QBTORRENT_UI_HOST_PORT}:${QBTORRENT_UI_CONTAINER_PORT}
      - ${QBTORRENT_TORRENTING_HOST_PORT}:${QBTORRENT_TORRENTING_CONTAINER_PORT}/tcp
      - ${QBTORRENT_TORRENTING_HOST_PORT}:${QBTORRENT_TORRENTING_CONTAINER_PORT}/udp
    volumes:
      - ./qbittorrent/appdata:/config # Contains all relevant configuration files.
      - ./qbittorrent/downloads:/downloads # Location of downloads on disk. This will be mapped to a different folder 
    restart: unless-stopped

  netbootxyz:
    image: lscr.io/linuxserver/netbootxyz:latest
    container_name: netbootxyz
    environment:
      # You can set any environment variable from a file by using a special prepend FILE__.
      # -e FILE__MYVAR=/run/secrets/mysecretvariable
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      MENU_VERSION: 2.0.84 #optional
      PORT_RANGE: 30000:30010 #optional. Specify the port range tftp will use for data transfers (see Wikipedia)
      SUBFOLDER: / #optional
      NGINX_PORT: 80 #optional
      WEB_APP_PORT: 3000 #optional
    networks:
      - nas_network
    ports:
      - ${NETBOOT_HOST_TCP_PORT}:${NETBOOT_CONTAINER_TCP_PORT}/tcp
      - ${NETBOOT_HOST_UDP_PORT}:${NETBOOT_CONTAINER_UDP_PORT}/udp
      # - 8080:80 #optional
    volumes: # TODO move to volume
      - ./netbootxyz/config:/config # Storage for boot menu files and web application config
      - ./netbootxyz/assets:/assets # optional # Storage for NETBOOT.XYZ bootable assets (live CDs and other files)
    restart: unless-stopped