# TODO server.yaml migrate to named volumes
# docker images --format "{{ .Size }} \t {{ .Repository }}" | sort -h

networks:
  cluster_network:          # Docker Swarm overlay network
    external: true

volumes:
  grafana-data:
    name: grafana-data # TODO change volume type
  kuma-data:
    name: kuma-data  # TODO I'll keep the configuration but not the logging
  prowlarr-data:
    name: prowlarr-data
  arr-data:
    name: arr-data # TODO change volume type. Avoid /home.
      #    data
      #    ├── torrents
      #    │   ├── books
      #    │   ├── movies
      #    │   ├── music
      #    │   └── tv
      #    ├── usenet
      #    │   ├── incomplete
      #    │   └── complete
      #    │       ├── books
      #    │       ├── movies
      #    │       ├── music
      #    │       └── tv
      #    └── media
      #        ├── books
      #        ├── movies
      #        ├── music
      #        └── tv
  prometheus-data:
    name: prometheus-data # TODO change volume type
  mkadocs-data:
    name: mkdocs-data # TODO

include:
  # Apps
  - path:
      - compose/server/apps/it-tools.yaml
      - compose/server/apps/change-detection.yaml          
      - compose/server/apps/code-server.yaml
      - compose/server/apps/omni-tools.yaml   
      - compose/server/apps/networking-toolbox.yaml  
      - compose/server/apps/convertx.yaml    
      - compose/server/apps/raid-calculator.yaml                                                                                                    
      # - compose/server/apps/documentation.yaml                    # Crashes.
      - compose/server/apps/jsoncrack.yaml                          
      - compose/server/apps/stirling.yaml                           # 1.88GB. Consider using latest-ultra-lite tag
      - compose/server/apps/web-check.yaml                          # 2.71GB
  - path: 
      - compose/server/apps/mirotalk.yaml                           # Requires pulling the Github repo first and install from bash script
                                                                    # https://github.com/miroslavpejic85/mirotalk
    env_file:
      - mirotalk/.mirotalk.env

  # Arr
  - path:
      - compose/server/arr/jellyseerr.yaml                          # 1.42 GB. 
      - compose/server/arr/prowlarr.yaml
      - compose/server/arr/radarr.yaml
      - compose/server/arr/readarr.yaml
      - compose/server/arr/sonarr.yaml

  # Observability
  - path:
      - compose/server/observability/cadvisor.yaml
      - compose/server/observability/dozzle.yaml
      - compose/server/observability/glances.yaml
      - compose/server/observability/grafana.yaml
      - compose/server/observability/prometheus.yaml
      - compose/server/observability/uptime-kuma.yaml

  # Tunnel
  - path:
      - compose/server/admin/cloudflare.yaml
