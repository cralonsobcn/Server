networks:
  cluster_network:
    external: true
  scrutiny_collector_network:
    external: true

volumes:
  jellyfin-media: 
    name: jellyfin-media
    driver: local
  qbitorrent-data: 
    name: qbitorrent-data
    driver: local
  netbootxyz-data: 
    name: netbootxyz-data
    driver: local
  gsdb:
    name: gaseous-database
    driver: local
  gs:
    name: gaseous
    driver: local

include:

  # Administration and Proxying
  - path:
    - compose/nas/management/cloudflared.yaml
    - compose/nas/management/dockerproxy.yaml

  # Scrutiny Collector to scrap HDD and SDD smart metrics
  - path:
    - compose/nas/management/scrutiny-collector.yaml                     # TODO. Fix POST against the API. Connection Refused.
    
  # Utility and Development
  - path:
    - compose/nas/apps/cryptpad.yaml                                # PENDING CONFIGURATION
    - compose/nas/apps/gitea.yaml
    - compose/nas/apps/netboot.yaml

  # Media applications
  - path:
    # - compose/nas/media/gaseous.yaml                              # Temporarily disabled. TODO review port
    - compose/nas/media/jellyfin.yaml
    - compose/nas/media/qbittorrent.yaml

  # File systems
  - path:
    - compose/nas/apps/rustfs.yaml                                  # Finish configuration