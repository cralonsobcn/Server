# TODO server.yaml migrate to named volumes

networks:
  internal_network:
    driver: bridge
    name: internal_network

volumes:
  grafana-data:
    name: grafana-data # TODO change volume type
  kuma-data:
    name: kuma-data  # TODO I'll keep the configuration but not the logging
  prowlarr-data:
    name: prowlarr-data
  arr-data:
    name: arr-data # TODO change volume type. Avoid /home.
      #    data
      #    ├── torrents
      #    │   ├── books
      #    │   ├── movies
      #    │   ├── music
      #    │   └── tv
      #    ├── usenet
      #    │   ├── incomplete
      #    │   └── complete
      #    │       ├── books
      #    │       ├── movies
      #    │       ├── music
      #    │       └── tv
      #    └── media
      #        ├── books
      #        ├── movies
      #        ├── music
      #        └── tv
  prometheus-data:
    name: prometheus-data # TODO change volume type
  mkadocs-data:
    name: mkdocs-data # TODO

include:
  - path:
      # Apps
      - compose/apps/it-tools.yaml
      - compose/apps/change-detection.yaml          
      - compose/apps/code-server.yaml
      - compose/apps/documentation.yaml
      # - compose/apps/jsoncrack.yaml                        # This app needs to be build through the Dockerfile. TODO Automate it.
      - compose/apps/stirling.yaml                           # 844 MB
      - compose/apps/web-check.yaml                          # 1 GB
  - path:
      # Arr
      - compose/arr/jellyseerr.yaml                          # 1.42 GB
      - compose/arr/prowlarr.yaml
      - compose/arr/radarr.yaml
      - compose/arr/readarr.yaml
      - compose/arr/sonarr.yaml
  - path:
      # Observability
      - compose/observability/cadvisor.yaml
      - compose/observability/dozzle.yaml
      - compose/observability/glances.yaml
      - compose/observability/grafana.yaml
      - compose/observability/prometheus.yaml
      - compose/observability/uptime-kuma.yaml
  - path:
      # Dashboard
      - compose/dashboard/homepage.yaml
  - path:
      # Admin
      - compose/admin/dockerproxy.yaml
      - compose/admin/cloudflare.yaml
