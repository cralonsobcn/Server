services:
  uptime-kuma:
    image: docker.io/louislam/uptime-kuma:latest
    container_name: uptime-kuma
    environment:
      TZ: ${TZ}
    networks:
      - internal_network
    ports:
      - ${UPTIMEKUMA_HOST_PORT}:${UPTIMEKUMA_CONTAINER_PORT}
    volumes:
      - kuma-data:/app/data # ./uptime_kuma/data:/app/data
      - ${DOCKER_SOCK}:${DOCKER_SOCK} # path to docker.sock
    restart: ${RESTART_POLICY}